  <!-- Prevent theme flash: dark is the default; only saved 'light' opts out. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved !== 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* default to dark via class on <html> */ }
    })();
  </script>

  <!-- Fonts: Syne (display) / Inter (body) / Space Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
