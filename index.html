<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Muhammad Abdullah Bhatti — AI/ML Developer, Full Stack Engineer, Data Science Enthusiast. Portfolio showcasing projects in Python, AI/ML, C++, and Web Development." />
  <title>Muhammad Abdullah Bhatti — AI/ML Developer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2300d4ff'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='26' font-weight='bold' fill='%230a1628' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E" />

  <!-- Prevent theme flash: dark is the default; only saved 'light' opts out. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var dark = saved !== 'light';
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) { /* default to dark via class on <html> */ }
    })();
  </script>

  <!-- Fonts: Syne (display) / Inter (body) / Space Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
